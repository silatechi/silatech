
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">SILA TECH — Technologies and Tools</title>
  <desc id="desc">Animated technology showcase featuring programming, databases, AI, automation, and development tools.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090f"/>
      <stop offset="50%" stop-color="#17102b"/>
      <stop offset="100%" stop-color="#080d17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1730"/>
      <stop offset="100%" stop-color="#10131f"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8b5cf6" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .heading{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#fff}
      .subheading{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;fill:#22d3ee}
      .tech{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;fill:#f4f3ff}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#a8a6c3}
      .panel{fill:url(#card);stroke:#51417a;stroke-opacity:.65;stroke-width:1.2}
      .chip{fill:#201a35;stroke:#6d4bc2;stroke-opacity:.65;stroke-width:1}
      .dot{fill:#22d3ee}
    </style>
  </defs>

  <rect width="1000" height="800" rx="26" fill="url(#bg)"/>
  <rect width="1000" height="800" rx="26" fill="url(#grid)"/>
  <rect x="2" y="2" width="996" height="796" rx="24" fill="none" stroke="url(#accent)" stroke-width="2"/>

  <circle cx="910" cy="95" r="95" fill="#8b5cf6" opacity=".07">
    <animate attributeName="r" values="85;110;85" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="690" r="120" fill="#22d3ee" opacity=".045"/>

  <g text-anchor="middle">
    <text x="500" y="62" class="subheading">THE SILA TECH STACK</text>
    <text x="500" y="108" class="heading" font-size="34">TECHNOLOGIES <tspan fill="#22d3ee">&amp;</tspan> TOOLS</text>
    <rect x="365" y="125" width="270" height="3" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="180;270;180" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="410;365;410" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="151" class="small">Building digital solutions with modern technology</text>
  </g>

  <!-- PROGRAMMING & WEB -->
  <g>
    <rect x="30" y="180" width="940" height="190" rx="18" class="panel"/>
    <rect x="30" y="180" width="6" height="190" rx="3" fill="#a855f7"/>
    <circle cx="66" cy="212" r="14" fill="#a855f7" opacity=".18"/>
    <text x="66" y="217" text-anchor="middle" font-size="17" fill="#c084fc" font-family="Arial">&lt;/&gt;</text>
    <text x="91" y="217" class="heading" font-size="20">Programming &amp; Web</text>
    <text x="944" y="215" text-anchor="end" class="small">01 / DEVELOPMENT</text>

    <g>
      <rect x="52" y="240" width="170" height="52" rx="11" class="chip"/>
      <text x="68" y="271" font-size="19" font-weight="800" fill="#e879f9" font-family="Arial">5</text>
      <text x="94" y="271" class="tech">HTML5</text>

      <rect x="238" y="240" width="170" height="52" rx="11" class="chip"/>
      <text x="254" y="271" font-size="19" font-weight="800" fill="#60a5fa" font-family="Arial">3</text>
      <text x="280" y="271" class="tech">CSS3</text>

      <rect x="424" y="240" width="170" height="52" rx="11" class="chip"/>
      <text x="440" y="271" font-size="17" font-weight="800" fill="#facc15" font-family="Arial">JS</text>
      <text x="470" y="271" class="tech">JavaScript</text>

      <rect x="610" y="240" width="170" height="52" rx="11" class="chip"/>
      <text x="626" y="271" font-size="17" font-weight="800" fill="#60a5fa" font-family="Arial">TS</text>
      <text x="657" y="271" class="tech">TypeScript</text>

      <rect x="796" y="240" width="150" height="52" rx="11" class="chip"/>
      <text x="811" y="271" font-size="17" font-weight="800" fill="#22d3ee" font-family="Arial">R</text>
      <text x="838" y="271" class="tech">React</text>

      <rect x="52" y="305" width="205" height="45" rx="10" class="chip"/>
      <text x="68" y="333" font-size="17" font-weight="800" fill="#fff" font-family="Arial">N</text>
      <text x="94" y="333" class="tech">Next.js</text>

      <rect x="274" y="305" width="205" height="45" rx="10" class="chip"/>
      <circle cx="293" cy="327" r="9" fill="#43853d"/>
      <text x="310" y="333" class="tech">Node.js</text>

      <rect x="496" y="305" width="205" height="45" rx="10" class="chip"/>
      <text x="514" y="333" font-size="17" font-weight="800" fill="#facc15" font-family="Arial">Py</text>
      <text x="548" y="333" class="tech">Python</text>

      <rect x="718" y="305" width="228" height="45" rx="10" fill="#201a35" stroke="#22d3ee" stroke-opacity=".55">
        <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="832" y="333" text-anchor="middle" class="small">BUILD • CODE • CREATE</text>
    </g>
  </g>

  <!-- DATABASE & BACKEND -->
  <g>
    <rect x="30" y="390" width="940" height="125" rx="18" class="panel"/>
    <rect x="30" y="390" width="6" height="125" rx="3" fill="#22d3ee"/>
    <circle cx="66" cy="420" r="14" fill="#22d3ee" opacity=".16"/>
    <ellipse cx="66" cy="416" rx="8" ry="4" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <path d="M58 416V427C58 432 74 432 74 427V416M58 421C58 426 74 426 74 421" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="91" y="426" class="heading" font-size="20">Database &amp; Backend</text>

    <g>
      <rect x="52" y="444" width="205" height="48" rx="10" class="chip"/>
      <circle cx="72" cy="468" r="7" fill="#3ecf8e"/>
      <text x="89" y="474" class="tech">Supabase</text>

      <rect x="274" y="444" width="205" height="48" rx="10" class="chip"/>
      <circle cx="294" cy="468" r="7" fill="#47a248"/>
      <text x="311" y="474" class="tech">MongoDB</text>

      <rect x="496" y="444" width="205" height="48" rx="10" class="chip"/>
      <circle cx="516" cy="468" r="7" fill="#60a5fa"/>
      <text x="533" y="474" class="tech">PostgreSQL</text>

      <rect x="718" y="444" width="105" height="48" rx="10" class="chip"/>
      <text x="770" y="474" text-anchor="middle" class="tech" font-size="14">Firebase</text>

      <rect x="836" y="444" width="110" height="48" rx="10" class="chip"/>
      <text x="891" y="474" text-anchor="middle" class="tech" font-size="14">REST APIs</text>
    </g>
  </g>

  <!-- AI & AUTOMATION -->
  <g>
    <rect x="30" y="535" width="940" height="100" rx="18" class="panel"/>
    <rect x="30" y="535" width="6" height="100" rx="3" fill="#f472b6"/>
    <circle cx="66" cy="565" r="14" fill="#f472b6" opacity=".17"/>
    <path d="M60 565Q60 557 66 557Q72 557 72 565V573H60Z M63 576H69" fill="none" stroke="#f472b6" stroke-width="1.7"/>
    <text x="91" y="571" class="heading" font-size="20">AI &amp; Automation</text>

    <rect x="52" y="587" width="285" height="32" rx="9" class="chip"/>
    <text x="194" y="608" text-anchor="middle" class="tech" font-size="15">Artificial Intelligence</text>

    <rect x="356" y="587" width="270" height="32" rx="9" class="chip"/>
    <text x="491" y="608" text-anchor="middle" class="tech" font-size="15">Automation</text>

    <rect x="645" y="587" width="301" height="32" rx="9" class="chip"/>
    <text x="795" y="608" text-anchor="middle" class="tech" font-size="15">WhatsApp Bots</text>
  </g>

  <!-- DEVELOPMENT TOOLS -->
  <g>
    <rect x="30" y="655" width="940" height="100" rx="18" class="panel"/>
    <rect x="30" y="655" width="6" height="100" rx="3" fill="#facc15"/>
    <circle cx="66" cy="684" r="14" fill="#facc15" opacity=".16"/>
    <path d="M59 680L66 676L73 680V688L66 692L59 688Z M59 680L66 684L73 680 M66 684V692" fill="none" stroke="#facc15" stroke-width="1.4"/>
    <text x="91" y="691" class="heading" font-size="20">Development Tools</text>

    <g>
      <rect x="52" y="705" width="145" height="32" rx="9" class="chip"/>
      <text x="124" y="726" text-anchor="middle" class="tech" font-size="15">Git</text>

      <rect x="207" y="705" width="145" height="32" rx="9" class="chip"/>
      <text x="279" y="726" text-anchor="middle" class="tech" font-size="15">GitHub</text>

      <rect x="362" y="705" width="145" height="32" rx="9" class="chip"/>
      <text x="434" y="726" text-anchor="middle" class="tech" font-size="15">Termux</text>

      <rect x="517" y="705" width="205" height="32" rx="9" class="chip"/>
      <text x="619" y="726" text-anchor="middle" class="tech" font-size="15">Android Studio</text>

      <rect x="732" y="705" width="214" height="32" rx="9" class="chip"/>
      <text x="839" y="726" text-anchor="middle" class="tech" font-size="15">Linux</text>
    </g>
  </g>

  <text x="500" y="782" text-anchor="middle" class="small">SILA TECH • TECHNOLOGY • AI • INNOVATION</text>
</svg>
